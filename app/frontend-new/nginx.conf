worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;
    
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        
        # Redirect old Easy Auth URLs to MSAL-based auth page
        # This handles users with cached/bookmarked Easy Auth URLs
        location ~ ^/\.auth/ {
            return 302 /auth;
        }
        
        # Debug endpoint to check headers
        location = /debug/headers {
            default_type application/json;
            return 200 '{"msg":"Use browser dev tools to check headers"}';
        }
        
        # Service worker and manifest - no cache to ensure updates
        location ~* (sw\.js|manifest\.webmanifest|workbox.*\.js)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
        
        # HTML files - minimal cache with revalidation
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }
        
        # Static assets with long cache (hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # =====================================================================
        # LEGACY-PATH REWRITES (T072) -- specs/007-frontend-new/contracts/routes.md §1
        # =====================================================================
        # These mirror app/frontend-new/src/app/redirects.tsx (client-side,
        # used inside the SPA once it's booted) so a bookmarked/shared legacy
        # link also gets a real server redirect *before* the SPA loads --
        # deep links, bookmarks and crawlers get a 301 straight from nginx.
        #
        # All GET-only SPA paths -> 301 (permanent): there is no legacy
        # server-side behavior tied to these paths (no POST/forms hit them),
        # the mapping is permanent for the life of the redesign, and 301
        # lets browsers/crawlers cache the new location like the client-side
        # redirect intends.
        #
        # NOT handled here (can't be done in nginx, left to the SPA):
        #   - `/` : legacy Landing, redirects to `/projects` only when the
        #     visitor is signed in (checked client-side via MSAL cache).
        #     nginx has no way to read that state, so `/` always falls
        #     through to the SPA fallback below, same as it does today.
        #   - `/auth`, `/auth/callback`, `/github/callback`, `/terms`,
        #     `/privacy`, `/license`, `/settings/profile`,
        #     `/settings/organization` : same path in both apps, no redirect
        #     needed -- SPA fallback serves them directly.

        # --- Simple top-level renames --------------------------------------
        location = /dashboard {
            return 301 /projects$is_args$args;
        }
        location = /gallery {
            return 301 /library/gallery$is_args$args;
        }
        location = /standards {
            return 301 /library/standards$is_args$args;
        }
        location = /tech-stacks {
            return 301 /library/tech-stacks$is_args$args;
        }
        location = /build-books {
            return 301 /library/build-books$is_args$args;
        }
        location = /build-books/new {
            return 301 /library/build-books/new$is_args$args;
        }
        location ~ ^/build-books/(?<bb_id>[^/]+)/edit$ {
            return 301 /library/build-books/$bb_id/edit$is_args$args;
        }
        location ~ ^/build-books/(?<bb_id>[^/]+)$ {
            return 301 /library/build-books/$bb_id$is_args$args;
        }

        # --- Project pages: /project/:id/<page>[/t/:token] ------------------
        # Path param and, where present, the share token are both preserved;
        # the token moves from a path segment to the `t` query param per the
        # contract ("legacy `/project/:id/<page>/t/:token` -> new
        # `/p/:id/<route>?t=:token`").
        location ~ ^/project/(?<p_id>[^/]+)/settings/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/settings?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/settings$ {
            return 301 /p/$p_id/settings$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/requirements/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/define/requirements?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/requirements$ {
            return 301 /p/$p_id/v/current/define/requirements$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/standards/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/define/standards?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/standards$ {
            return 301 /p/$p_id/v/current/define/standards$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/artifacts/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/define/artifacts?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/artifacts$ {
            return 301 /p/$p_id/v/current/define/artifacts$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/chat/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/define/chat?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/chat$ {
            return 301 /p/$p_id/v/current/define/chat$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/canvas/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/design/canvas?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/canvas$ {
            return 301 /p/$p_id/v/current/design/canvas$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/specifications/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/design/specifications?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/specifications$ {
            return 301 /p/$p_id/v/current/design/specifications$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/build/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/build/agent?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/build$ {
            return 301 /p/$p_id/v/current/build/agent$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/repository/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/build/repository?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/repository$ {
            return 301 /p/$p_id/v/current/build/repository$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/database/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/build/database?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/database$ {
            return 301 /p/$p_id/v/current/build/database$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/deploy/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/ship/environments?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/deploy$ {
            return 301 /p/$p_id/v/current/ship/environments$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/audit/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/ship/audit?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/audit$ {
            return 301 /p/$p_id/v/current/ship/audit$is_args$args;
        }
        location ~ ^/project/(?<p_id>[^/]+)/present/t/(?<p_token>[^/]+)$ {
            return 301 /p/$p_id/v/current/ship/present?t=$p_token;
        }
        location ~ ^/project/(?<p_id>[^/]+)/present$ {
            return 301 /p/$p_id/v/current/ship/present$is_args$args;
        }
        # =====================================================================
        # END LEGACY-PATH REWRITES
        # =====================================================================

        # SPA fallback - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # API proxy (optional - if you want to proxy API calls through frontend)
        # location /api/ {
        #     proxy_pass https://<APIM_GATEWAY>/api/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection 'upgrade';
        #     proxy_set_header Host $host;
        #     proxy_cache_bypass $http_upgrade;
        # }
    }
}
