# Sample caller pipeline, as generated by Pronghorn onboarding (D-12) for an
# Azure Pipelines repository. Drop this at azure-pipelines/assurance-mesh.yml
# (or azure-pipelines.yml) in the target repository, and set it as the build
# validation policy on the default branch (PRs to it, research.md D-10).
trigger: none

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: assuranceMesh
      type: github
      name: goa-standards/assurance-mesh
      # Pin to the full commit SHA of the v3 release, never a mutable
      # tag/branch (README.md "Release process"). Onboarding fills in the
      # real SHA when it generates this file.
      ref: 0000000000000000000000000000000000000000 # PLACEHOLDER
      endpoint: goa-standards-github # a GitHub service connection with read access to the mesh repo

extends:
  template: templates/mesh.yml@assuranceMesh
  parameters:
    profile: dotnet
    buildCommand: "dotnet build --configuration Release && dotnet test --configuration Release"
    packVersion: "2026.3"
    cyberRiskSandbox: false
    policySource: ""
    pronghornApiUrl: "https://api.pronghorn.example"
    testEnvironmentUrl: "https://test.permits-api.example.gov.ab.ca"
    reportHmacKeyVariable: PRONGHORN_REPORT_SECRET
