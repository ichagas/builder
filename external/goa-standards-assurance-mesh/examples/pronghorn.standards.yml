# Generated by Pronghorn onboarding into the repository root. Pins the
# Standards pack, stack profile, build command and mesh policy, and keeps the
# repository in sync when a new pack is published (an update PR).
pronghorn:
  repository: goa/permits-api
  pack_version: "2026.3" # pin; workflow_ref is packs/2026.3/manifest.yml -> goa-standards/assurance-mesh@v3
  profile: dotnet
  build_command: "dotnet build --configuration Release && dotnet test --configuration Release"
  ci_provider: github_actions # or azure_pipelines
  mesh_policy:
    # mode: issue (default) | notify | block | off
    # a narrower scope (team, application) may only tighten what the
    # organization sets (data-model.md `mesh_policy`, research.md D-15)
    green: issue
    yellow: issue
    red: issue
    blue: issue
  cyber_risk_sandbox: false
