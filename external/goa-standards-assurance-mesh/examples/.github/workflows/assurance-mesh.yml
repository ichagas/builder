# Sample caller workflow, as generated by Pronghorn onboarding (D-12) for a
# GitHub Actions repository. Drop this at .github/workflows/assurance-mesh.yml
# in the target repository.
name: Assurance Mesh

on:
  pull_request:
    branches: [main]

jobs:
  mesh:
    uses: goa-standards/assurance-mesh/.github/workflows/mesh.yml@v3
    with:
      profile: node
      build_command: "npm ci && npm test"
      pack_version: "2026.3"
      cyber_risk_sandbox: false
      policy_source: "" # empty: every check defaults to policy mode "issue"
      pronghorn_api_url: "https://api.pronghorn.example"
      test_environment_url: "https://test.permits-web.example.gov.ab.ca"
    secrets:
      report_hmac_key: ${{ secrets.PRONGHORN_REPORT_SECRET }}
